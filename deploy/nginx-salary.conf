# 工资系统 —— 子域名反代配置（参考用）
#
# ⚠️ 该文件已不再被 setup-aliyun.sh 直接引用（脚本改为内联生成同一内容）。
#    保留此文件仅作手动排障参考。线上真实生效文件在 ECS 的：
#    /etc/nginx/conf.d/salary.conf
#
# 反代架构说明：
#   - 系统 nginx 接管 80/443（/etc/nginx/conf.d/ 被主配置 include）
#   - 本配置只新增 salary 这一个 server，不影响其他站点（如 sky.conf）
#   - 后端 Node 进程运行在 3001 端口（PM2: huizhi-salary）
#   - 证书由 certbot webroot 模式签发在 /etc/letsencrypt/live/<域名>/

server {
    listen 80;
    listen [::]:80;
    server_name salary.YOURDOMAIN.com;

    # Let's Encrypt http-01 验证路径（证书签发/续期必须走静态文件）
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # HTTP 全部跳转到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name salary.YOURDOMAIN.com;

    ssl_certificate /etc/letsencrypt/live/salary.YOURDOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salary.YOURDOMAIN.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 工资条导入/导出可能上传文件，适当放大 body 上限
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
